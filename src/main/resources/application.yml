# ===================================================================
# Spring Boot base configuration — overridden by active profile.
# ===================================================================

spring:
  application:
    name: foundation-ai-chat-service
  datasource:
    url: jdbc:postgresql://${iqkv.db.host}:${iqkv.db.port}/${iqkv.db.name}
    username: ${iqkv.db.username}
    password: ${iqkv.db.password}
  rabbitmq:
    host: ${iqkv.rabbitmq.host}
    port: ${iqkv.rabbitmq.port}
    username: ${iqkv.rabbitmq.username}
    password: ${iqkv.rabbitmq.password}
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/system/db.changelog-system.xml
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL:llama3.2}

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    # Extended for LLM inference — llama3.1:8b can take 60-120s for long responses.
    connection-timeout: 180s

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

iqkv:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:aichatservice}
    username: ${DB_USERNAME:svc_aichat_dba}
    password: ${DB_PASSWORD:svc_aichat_dba}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:svc_aichat_rmq}
    password: ${RABBITMQ_PASSWORD:svc_aichat_rmq}
  messaging:
    rabbitmq:
      # Controlled via MESSAGING_ENABLED env var; defaults to false for local safety.
      # Helm chart configmap sets this per environment (sit/uat/prd).
      enabled: ${MESSAGING_ENABLED:false}
  platform:
    # Platform-wide operational mode: MULTI_TENANT (default) or SINGLE_TENANT.
    # Must be the same value across all core services (IAM, Billing, CMS, etc.).
    rollout-mode: ${ROLLOUT_MODE:MULTI_TENANT}
  tenancy:
    # Default tenant key for SINGLE_TENANT mode (optional).
    # Format: 8-character NanoID using alphabet [a-z0-9], e.g. abc12345
    default-tenant-key: platform
    # Display name for the default tenant in SINGLE_TENANT mode
    default-tenant-name: ${DEFAULT_TENANT_NAME:Acme Corp.}
    schema-prefix: t_
    default-schema: public
    provisioning-timeout: PT10M
  liquibase:
    tenant-runner-enabled: true
    system-change-log: db/changelog/system/db.changelog-system.xml
    tenant-change-log: db/changelog/tenant/db.changelog-tenant.xml
  billing:
    # Billing service base URL used for quota / plan enforcement
    service-url: ${BILLING_SERVICE_URI:http://foundation-billing-service}
    # How often the plan catalog cache is refreshed (ISO-8601 duration)
    plan-refresh-interval: ${BILLING_PLAN_REFRESH_INTERVAL:PT10M}
  ai:
    # System prompt injected on every chat request.
    # Frames the assistant's role, constrains allowed topics, and sets output style.
    # Override via AI_SYSTEM_PROMPT env var to customise without a rebuild.
    system-prompt: ${AI_SYSTEM_PROMPT:You are a support specialist for the iQ Key Value platform.\
      Your goal is to help users understand their account, billing plans, and platform features in a clear and approachable way.\
      Communicate in a warm, conversational tone - like a helpful colleague, not a technical manual.\
      Always personalize your responses by using the user's name when appropriate.\
      Explain concepts in simple, everyday language without technical jargon, code samples, or JSON responses.\
      When discussing plans or features, focus on benefits and value rather than technical specifications.\
      Be polite, patient, and genuinely helpful. If you don't know something, say so honestly and guide them to the right resource.\
      If a question is outside platform support (like politics, religion, or personal advice), politely redirect with kindness.\
      Keep responses concise but complete - provide just enough information to be helpful without overwhelming.}
    # Maximum number of characters accepted from the user message (input guard).
    # Messages longer than this are truncated before being sent to the LLM.
    max-input-chars: ${AI_MAX_INPUT_CHARS:4000}
    # Maximum number of tokens the LLM may generate in a single response (output guard).
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
    # Temperature controls response creativity.
    # 0.0-0.3 = focused/factual, 0.7-1.0 = creative. Default 0.7 suits general Q&A.
    temperature: ${AI_TEMPERATURE:0.7}
    # Default Ollama model tag used when the client request omits the model field.
    # Reads the same env var as spring.ai.ollama.chat.model so there is a single
    # value to configure — no separate AI_DEFAULT_MODEL needed.
    default-model: ${SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL:llama3.1:8b}
  auth:
    jwt:
      # --- Deployed (K8s) — set JWT_JWKS_URI in Helm values / K8s configmap ---
      # JWKS URI of the IAM service. Keys are fetched, cached, and refreshed automatically
      # when a JWT carries an unknown kid — enabling transparent key rotation.
      # Leave blank (or unset JWT_JWKS_URI) to fall back to public-key-path below.
      # Example: http://foundation-iam-service/.well-known/jwks.json
      jwks-uri: ${JWT_JWKS_URI:}
      # --- Local development and tests — ignored when jwks-uri is set ---
      # Path to the RSA public key PEM. Accepts classpath: (tests) or file: resources.
      public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}

git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
