# ===================================================================
# Spring Boot configuration for the "test" profile.
# Activated via @ActiveProfiles("test") on test classes.
# Only contains overrides and test-specific values relative to application.yml.
# ===================================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  liquibase:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

iqkv:
  liquibase:
    tenant-runner-enabled: false  # Disables TenantLiquibaseRunner on startup; tests manage schema setup themselves
  messaging:
    rabbitmq:
      enabled: false
  auth:
    jwt:
      jwks-uri: ""
      public-key-path: "classpath:keys/public.pem"
