services:
  # PostgreSQL Database for Ai Chat Service
  postgres-aichat:
    extends:
      file: compose.base.yaml
      service: postgres-aichat

  # RabbitMQ for Ai Chat Service
  rabbitmq-aichat:
    extends:
      file: compose.base.yaml
      service: rabbitmq-aichat

  # MailHog for local email testing
  mailhog:
    extends:
      file: compose.base.yaml
      service: mailhog

  # DbGate - Database Administration Tool
  dbgate:
    extends:
      file: compose.base.yaml
      service: dbgate

  # SonarQube for code quality analysis
  sonar:
    extends:
      file: compose.base.yaml
      service: sonar

  # Prometheus for metrics collection
  prometheus:
    extends:
      file: compose.base.yaml
      service: prometheus

  # Grafana for metrics visualization
  grafana:
    extends:
      file: compose.base.yaml
      service: grafana

networks:
  aichat-service-network:
    name: foundation-aichat-network-dev
    external: false

volumes:
  postgres_aichat_data:
    name: iqkv_aichat_postgres_data_dev
  rabbitmq_aichat_data:
    name: iqkv_aichat_rabbitmq_data_dev
  dbgate_aichat_data:
    name: iqkv_aichat_dbgate_data_dev
  aichat_logs:
    name: iqkv_aichat_logs_dev
  aichat_tmp:
    name: iqkv_aichat_tmp_dev
